name: Java CI with Maven

# Trigger the workflow on pushes to main and on all Pull Requests targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    name: Build, Test, and Format Check
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 21 and configure Maven caching for faster builds
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compile and run all tests (mvn verify includes compile and test phases)
      - name: Build and Run Tests
        run: mvn clean verify --batch-mode

      # 4. Run Checkstyle / Formatting checks
      - name: Check Code Formatting
        run: mvn checkstyle:check --batch-mode