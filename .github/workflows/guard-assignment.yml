name: Guard Assignment from Backlog

on:
  issues:
    types: [assigned, edited]

jobs:
  check-assignment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Enforce Ready Status for Assignment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            const { owner, repo } = context.issue;
            const issueNumber = context.payload.issue.number;
            const assignees = context.payload.issue.assignees || [];

            // If no assignees are present, skip checking
            if (assignees.length === 0) {
              console.log("No assignees on this issue.");
              return;
            }

            console.log(`Checking project status for issue #${issueNumber}...`);

            // 1. Query the project board status of the issue
            const query = `
              query($owner: String!, $repo: String!, $issueNum: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issueNum) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { owner, repo, issueNum: issueNumber });
            const projectItems = result.repository.issue?.projectItems?.nodes || [];

            if (projectItems.length === 0) {
              console.log("Issue is not on any project board.");
              return;
            }

            // 2. Check if the status field is currently set to 'Backlog'
            let isBacklog = false;
            for (const item of projectItems) {
              for (const val of item.fieldValues?.nodes || []) {
                if (val.field?.name === 'Status' && val.name === 'Backlog') {
                  isBacklog = true;
                  break;
                }
              }
              if (isBacklog) break;
            }

            // 3. If it's in Backlog, strip the assignee(s) and leave a warning comment
            if (isBacklog) {
              console.log("Issue is in Backlog! Removing assignees...");
              
              const usernames = assignees.map(a => a.login);
              await github.rest.issues.removeAssignees({
                owner,
                repo,
                issue_number: issueNumber,
                assignees: usernames
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `**Assignment Blocked:** Tasks cannot be assigned while an issue is still in the **Backlog**. Please clear its dependencies first so it automatically shifts to **Ready**!`
              });
            } else {
              console.log("Issue is not in Backlog. Assignment allowed.");
            }
