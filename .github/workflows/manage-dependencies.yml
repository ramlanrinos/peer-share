name: Manage Issue Dependencies and Status

on:
  issues:
    types: [opened, edited, closed, reopened]

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Evaluate Dependencies and Update Project Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            const { owner, repo } = context.issue;
            const triggerIssueNumber = context.payload.issue.number;
            const triggerIssueState = context.payload.issue.state;

            let issuesToEvaluate = [];

            // If an issue was just closed, DO NOT evaluate the closed issue itself.
            // Only find open issues that depend on it!
            if (triggerIssueState === 'closed' && context.payload.action === 'closed') {
              console.log(`Issue #${triggerIssueNumber} was closed. Finding dependent open issues...`);
              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                per_page: 100
              });

              for (const openIssue of openIssues) {
                const body = openIssue.body || "";
                if (body.includes(`#${triggerIssueNumber}`)) {
                  issuesToEvaluate.push(openIssue.number);
                }
              }
            } else {
              // For opened, edited, or reopened events, evaluate the trigger issue
              issuesToEvaluate.push(triggerIssueNumber);
            }

            issuesToEvaluate = [...new Set(issuesToEvaluate)];

            for (const issueNumber of issuesToEvaluate) {
              console.log(`\n--- Evaluating issue #${issueNumber} ---`);
              const { data: issueData } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              // CRITICAL GUARD: Skip evaluation if the issue is closed
              if (issueData.state === 'closed') {
                console.log(`Issue #${issueNumber} is CLOSED. Skipping project status update.`);
                continue;
              }

              const issueBody = issueData.body || "";

              // Extract all issue references (#123) from the body
              const issueRefRegex = /#(\d+)/g;
              const matches = [...issueBody.matchAll(issueRefRegex)];
              
              const dependentIssueNumbers = [...new Set(
                matches
                  .map(match => parseInt(match[1], 10))
                  .filter(num => num !== issueNumber)
              )];

              let shouldBeReady = false;

              // If there are NO dependencies, it should be Ready
              if (dependentIssueNumbers.length === 0) {
                console.log(`No dependencies found for issue #${issueNumber}. Moving directly to Ready.`);
                shouldBeReady = true;
              } else {
                console.log(`Found dependencies for #${issueNumber}: ${dependentIssueNumbers.join(', ')}`);

                let allClosed = true;
                for (const depNum of dependentIssueNumbers) {
                  try {
                    const { data: depIssue } = await github.rest.issues.get({
                      owner,
                      repo,
                      issue_number: depNum
                    });
                    
                    if (depIssue.state !== 'closed') {
                      allClosed = false;
                      console.log(`Dependency #${depNum} is still OPEN.`);
                      break;
                    } else {
                      console.log(`Dependency #${depNum} is CLOSED.`);
                    }
                  } catch (err) {
                    console.error(`Could not fetch state for dependency #${depNum}:`, err.message);
                    allClosed = false;
                    break;
                  }
                }

                if (allClosed) {
                  console.log(`All dependencies met for #${issueNumber}!`);
                  shouldBeReady = true;
                } else {
                  console.log(`Issue #${issueNumber} remains in Backlog (pending dependencies).`);
                }
              }

              if (shouldBeReady) {
                // Query project item
                const getProjectItemQuery = `
                  query($owner: String!, $repo: String!, $issueNum: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $issueNum) {
                        id
                        projectItems(first: 10) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                `;

                const projectResult = await github.graphql(getProjectItemQuery, {
                  owner,
                  repo,
                  issueNum: issueNumber
                });

                const projectItems = projectResult.repository.issue?.projectItems?.nodes || [];
                if (projectItems.length === 0) {
                  console.log(`Issue #${issueNumber} is not on a project board.`);
                  continue;
                }

                const projectItem = projectItems[0];
                const projectId = projectItem.project.id;
                const itemId = projectItem.id;

                // Query Status field & Ready option
                const getFieldsQuery = `
                  query($projectId: ID!) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        fields(first: 20) {
                          nodes {
                            ... on ProjectV2SingleSelectField {
                              id
                              name
                              options {
                                id
                                name
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `;

                const fieldResult = await github.graphql(fieldResultQuery, { projectId }).catch(async () => {
                  return await github.graphql(getFieldsQuery, { projectId });
                });
                const statusField = fieldResult.node?.fields?.nodes?.find(f => f.name === 'Status');
                if (!statusField) continue;

                const readyOption = statusField.options.find(o => o.name.toLowerCase() === 'ready');
                if (!readyOption) continue;

                // Mutation to move to Ready
                const updateStatusMutation = `
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $value }
                    }) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `;

                await github.graphql(updateStatusMutation, {
                  projectId,
                  itemId,
                  fieldId: statusField.id,
                  value: readyOption.id
                });

                console.log(`Successfully shifted open issue #${issueNumber} to 'Ready'!`);
              }
            }
